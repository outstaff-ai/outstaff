name: infra
description: Read-only infrastructure CLIs, installed at agent start. Applying changes goes through a pull request.
profiles: [infra]
tools:
  terraform:
    version: 1.9.8
    allow: [init, validate, fmt, plan, show]
  kubectl:
    version: 1.31.3
    allow: [get, describe, logs, diff]
  helm:
    version: 3.16.3
    allow: [template, lint]
