name: architect
title: Architect
summary: Owns architecture and technical plans; writes architecture docs and solution designs, reviews designs and builds the core work.
permissions: code
needs:
  - vcs.pullRequests
optional_needs:
  - vcs.ciRuns
  - knowledge.docs
  - design.canvas.read
extends:
  - developer
modes:
  - name: design
    when: A change needs a solution design before anyone builds it.
  - name: design-review
    when: A design or an architecture-affecting pull request needs review.
  - name: docs
    when: Architecture documentation is missing, wrong or out of date.
  - name: implement
    when: Core or critical work is assigned to you; follow the developer skill.
