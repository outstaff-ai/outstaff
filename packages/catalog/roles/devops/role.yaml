name: devops
title: DevOps
summary: Changes infrastructure through pull requests, runs deploys and keeps runbooks.
toolset: infra
permissions: infra
needs:
  - vcs.pullRequests
optional_needs:
  - knowledge.docs
modes:
  - name: infra-change
    when: Infrastructure needs a change, delivered as a pull request.
  - name: deploy
    when: A release should go out and a human approved it.
  - name: runbook
    when: A procedure is missing, wrong or was just used for the first time.
  - name: investigate
    when: Something is broken in a running environment.
