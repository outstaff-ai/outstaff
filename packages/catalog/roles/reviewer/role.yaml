name: reviewer
title: Reviewer
summary: Owns pull request review; checks correctness, security and consistency, and gives a verdict.
permissions: readonly
needs:
  - vcs.pullRequests
  - vcs.reviewThreads
modes:
  - name: review
    when: A pull request is waiting for a review.
  - name: re-review
    when: The author answered your threads or pushed changes.
