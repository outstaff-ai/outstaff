apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../agent
labels:
  - pairs:
      outstaff.work/person: sam
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: StatefulSet }
    patch: |-
      - { op: replace, path: /metadata/name, value: outstaff-agent-sam }
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: sam }
      - { op: replace, path: /spec/template/spec/volumes/0/secret/secretName, value: outstaff-agent-sam }
      - { op: replace, path: /spec/template/spec/volumes/1/persistentVolumeClaim/claimName, value: sam-home }
  - target: { kind: PersistentVolumeClaim }
    patch: |-
      - { op: replace, path: /metadata/name, value: sam-home }
