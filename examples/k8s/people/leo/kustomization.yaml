apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../agent
labels:
  - pairs:
      outstaff.work/person: leo
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: StatefulSet }
    patch: |-
      - { op: replace, path: /metadata/name, value: outstaff-agent-leo }
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: leo }
      - { op: replace, path: /spec/template/spec/volumes/0/secret/secretName, value: outstaff-agent-leo }
      - { op: replace, path: /spec/template/spec/volumes/1/persistentVolumeClaim/claimName, value: leo-home }
  - target: { kind: PersistentVolumeClaim }
    patch: |-
      - { op: replace, path: /metadata/name, value: leo-home }
