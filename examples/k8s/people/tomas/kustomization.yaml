apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../agent
nameSuffix: -tomas
labels:
  - pairs:
      outstaff.work/person: tomas
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: StatefulSet }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: tomas }
      - { op: replace, path: /spec/template/spec/volumes/0/projected/sources/0/secret/name, value: outstaff-agent-tomas }
