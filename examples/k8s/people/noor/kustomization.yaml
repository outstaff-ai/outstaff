apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../agent
labels:
  - pairs:
      outstaff.work/person: noor
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: StatefulSet }
    patch: |-
      - { op: replace, path: /metadata/name, value: outstaff-agent-noor }
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: noor }
      - { op: replace, path: /spec/template/spec/volumes/0/secret/secretName, value: outstaff-agent-noor }
      - { op: replace, path: /spec/template/spec/volumes/2/persistentVolumeClaim/claimName, value: noor-home }
  - target: { kind: PersistentVolumeClaim }
    patch: |-
      - { op: replace, path: /metadata/name, value: noor-home }
