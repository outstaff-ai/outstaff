# Secret names below are for the acme example's adapters; generate yours with `ost setup`.
# The template of one agent. people/<handle> sets the name, the person, the Secret and the volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outstaff-agent
  labels:
    app.kubernetes.io/name: outstaff-agent
spec:
  replicas: 1
  serviceName: outstaff-agent
  selector:
    matchLabels:
      app.kubernetes.io/name: outstaff-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outstaff-agent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The agent hands its work item back on SIGTERM; give it time.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/outstaff-ai/agent
          env:
            # The patches in people/<handle> replace the person; keep it the first entry.
            - { name: OUTSTAFF_PERSON, value: PERSON }
            - { name: OUTSTAFF_OFFICE_URL, value: "ws://outstaff-office:8080/agent" }
            # No team file: the agent receives the team config from the office when it connects.
          # No port and no probes: the agent listens on nothing and exits when it cannot run, and the
          # StatefulSet restarts it.
          # Starting points from the container contract. An agent that builds and tests needs more.
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi, ephemeral-storage: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/outstaff, readOnly: true }
            - { name: home, mountPath: /home/outstaff }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # The person's own Secret, generated in the top kustomization. It holds only the keys that person
        # needs, including the office GitHub App keys when they have repository grants. Replaced per person.
        - name: secrets
          secret:
            secretName: outstaff-agent-PERSON
            defaultMode: 0440
        # HOME of the agent: worktrees, memory and the tools mise installed. A plain PVC named
        # <handle>-home (agent/pvc.yaml), so the name is predictable and an existing volume can be adopted.
        - name: home
          persistentVolumeClaim:
            claimName: PERSON-home
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
