# The acme team on Kubernetes: kubectl apply -k examples/k8s
# Before building, put your team file next to this one:  cp <repo>/.outstaff/team.yaml examples/k8s/team.yaml
# Secret names below are for the acme example's adapters; generate yours with `ost setup`.
# Secrets are generated from files you add under secrets/ (see secrets/README.md); none are in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: outstaff-acme

resources:
  - namespace.yaml
  - network-policy.yaml
  - office
  # one StatefulSet per person; add or remove a folder in people/ when the team changes
  - people/priya
  - people/tomas
  - people/mira
  - people/leo
  - people/sam
  - people/noor
  - people/ines
  - people/kofi

configMapGenerator:
  - name: outstaff-team
    files:
      - team.yaml

# Pin the release you run. Replace with digests (newName@sha256:...) for fully reproducible rollouts.
images:
  - name: ghcr.io/outstaff-ai/office
    newTag: 0.1.0
  - name: ghcr.io/outstaff-ai/agent
    newTag: 0.1.0

# One Secret per scope, generated from files: one file per key under secrets/<scope>/KEY (gitignored, see
# secrets/README.md). A file per key keeps multi-line values such as PEM keys intact. The key list of each
# person is what `ost setup <handle>` lists for them; a person without repository grants gets no GitHub keys.
# Kustomize only reads files inside this folder, so the generators live here and not in people/<handle>.
secretGenerator:
  - name: outstaff-office
    files:
      - secrets/office/GH_OFFICE_APP_ID
      - secrets/office/GH_OFFICE_APP_INSTALLATION_ID
      - secrets/office/GH_OFFICE_APP_PRIVATE_KEY
      - secrets/office/GH_OFFICE_APP_SLUG
      - secrets/office/GH_OFFICE_APP_BOT_EMAIL
      - secrets/office/ITSAPLAN_API_KEY
      - secrets/office/SLACK_OFFICE_BOT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_PRIYA=secrets/priya/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_TOMAS=secrets/tomas/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_MIRA=secrets/mira/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_LEO=secrets/leo/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_SAM=secrets/sam/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_NOOR=secrets/noor/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_INES=secrets/ines/OUTSTAFF_AGENT_TOKEN
      - OUTSTAFF_AGENT_TOKEN_KOFI=secrets/kofi/OUTSTAFF_AGENT_TOKEN
  - name: outstaff-agent-priya
    files:
