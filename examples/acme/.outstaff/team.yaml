integrations:
  chat:
    adapter: slack
  vcs:
    adapter: github
  runtime:
    adapter: claude-agent-sdk
  tracker:
    adapter: itsaplan
    url: https://tracker.acme.example
    project: SHOP
  knowledge:
    adapter: itsaplan
  avatars:
    adapter: dicebear
    style: notionists

workflow:
  preset: kanban
  statuses:
    backlog: Backlog
    ready: Ready
    active: In Progress
    review: In Review
    blocked: Blocked
    done: Done
    canceled: Canceled

policies:
  # What outstaff does on its own. Everything below is on by default; set a switch to false (or none) to turn it off.
  acknowledge:
    chat: true
    vcs: true
  chat:
    profile: true
  design:
    canvas: true
  feedback:
    follow_up_round: true
    merged_prs: true
    doc_comments: true
    ticket_comments: true
    mentions: true
  hand_back:
    reassign: requester
    fallback: first_human
  tickets:
    prs_per_ticket: one
  conflicts:
    follow_up: true
  retry:
    on_signal: true
  messages:
    max_lines: 3
