# The acme team on one Docker host: an office, its Postgres, and one agent per person.
# Secret names below are for the acme example's adapters; generate yours with `ost setup`.
#
#   cp .env.example .env            # set POSTGRES_PASSWORD
#   mkdir -p secrets/office secrets/priya ...   # see secrets/README.md: one file per secret
#   docker compose up -d --build
#
# Secrets are Compose `secrets:` with file sources, mounted at /run/secrets/outstaff/<KEY> in the
# container that needs them. Nothing secret is in `environment:`, except the Postgres URL of the office
# (the office reads the store URL from the environment only).
#
# Images. This file builds them from the repository's images/Dockerfile so CI tests what it ships.
# For real use, delete the `build:` blocks and pin the released images instead:
#   office: ghcr.io/outstaff-ai/office:<version>
#   agent:  ghcr.io/outstaff-ai/agent:<version>
name: outstaff-acme

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

x-team:
  &team # The directory that holds team.yaml. A team repository works too: set OUTSTAFF_TEAM_REPO instead.
  type: bind
  source: ${OUTSTAFF_TEAM_DIR:-../acme/.outstaff}
  target: /team
  read_only: true

x-agent: &agent
  <<: *hardening
  image: ${OUTSTAFF_AGENT_IMAGE:-outstaff/agent:local}
  build:
    context: ../..
    dockerfile: images/Dockerfile
    target: agent
  depends_on:
    office: { condition: service_healthy }
  # The agent has no port and no health endpoint. It exits when it cannot start or the office rejects
  # its token, and the restart policy brings it back. Starting points, see the container contract.
  deploy:
    resources:
      limits: { cpus: "1", memory: 2g }
  environment: &agent-env
    OUTSTAFF_OFFICE_URL: ws://office:8080/agent
    OUTSTAFF_TEAM_FILE: /team/team.yaml

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outstaff
      POSTGRES_DB: outstaff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outstaff -d outstaff"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  office:
    <<: *hardening
    image: ${OUTSTAFF_OFFICE_IMAGE:-outstaff/office:local}
    build:
      context: ../..
      dockerfile: images/Dockerfile
      target: office
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      OUTSTAFF_TEAM_FILE: /team/team.yaml
      OUTSTAFF_STORE_URL: postgres://outstaff:${POSTGRES_PASSWORD}@postgres:5432/outstaff
    volumes:
      - { <<: *team }
      # Unused with Postgres; keeps the image's volume named instead of anonymous.
      - office-data:/var/lib/outstaff
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    # Publish nothing: agents reach 8080 on the Compose network. Add "8082:8082" only when the
    # team receives webhooks, behind a TLS proxy.
    networks: [backend, default]
    secrets:
      - { source: office_GH_OFFICE_APP_ID, target: /run/secrets/outstaff/GH_OFFICE_APP_ID }
      - {
          source: office_GH_OFFICE_APP_INSTALLATION_ID,
          target: /run/secrets/outstaff/GH_OFFICE_APP_INSTALLATION_ID,
        }
      - {
          source: office_GH_OFFICE_APP_PRIVATE_KEY,
          target: /run/secrets/outstaff/GH_OFFICE_APP_PRIVATE_KEY,
        }
      - { source: office_GH_OFFICE_APP_SLUG, target: /run/secrets/outstaff/GH_OFFICE_APP_SLUG }
      - { source: office_ITSAPLAN_API_KEY, target: /run/secrets/outstaff/ITSAPLAN_API_KEY }
      - {
          source: office_SLACK_OFFICE_BOT_TOKEN,
          target: /run/secrets/outstaff/SLACK_OFFICE_BOT_TOKEN,
        }
      - {
          source: priya_OUTSTAFF_AGENT_TOKEN,
          target: /run/secrets/outstaff/OUTSTAFF_AGENT_TOKEN_PRIYA,
        }
      - {
          source: tomas_OUTSTAFF_AGENT_TOKEN,
