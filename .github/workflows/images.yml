name: Images

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - images/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .dockerignore
      - .github/workflows/images.yml
  # the merge queue tests each PR combined with everything ahead of it
  merge_group:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [agent, office]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      # Native-arch build loaded into the runner, so the smoke test can start it.
      - name: Build (linux/amd64) for the smoke test
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64
          load: true
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test
        run: images/smoke.sh local ci ${{ matrix.image }}
      # Nothing is pushed here; this proves both architectures build.
      - name: Build (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    name: publish (${{ matrix.image }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [agent, office]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/outstaff-ai/${{ matrix.image }}
          # v1.2.3 -> 1.2.3; "latest" is added by `latest=auto` only for versions without a prerelease part
          tags: type=semver,pattern={{version}}
          flavor: latest=auto
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
