name: CI

on:
  pull_request:
    # edited: a PR whose base changes (e.g. a stacked PR retargeted) is checked again
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  single-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exactly one commit
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$COMMITS" != "1" ]; then
            echo "::error::This pull request has $COMMITS commits. PRs land as exactly one commit (merged with a merge commit): squash them, then push with --force-with-lease."
            exit 1
          fi

  conventional:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: PR title and commit subjects are conventional commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          bad=0
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be a conventional commit, e.g. 'feat(core): add the loader'. Got: $TITLE"
            bad=1
          fi
          for subject in $(git log --format='%s' "$BASE..$HEAD" | tr ' ' '\001'); do
            subject=$(printf '%s' "$subject" | tr '\001' ' ')
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit subject must be a conventional commit. Got: $subject"
              bad=1
            fi
          done
          exit $bad
