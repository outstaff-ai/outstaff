name: CI

on:
  pull_request:
    # edited: a PR whose base changes (e.g. a stacked PR retargeted) is checked again
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  single-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exactly one commit
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$COMMITS" != "1" ]; then
            echo "::error::This pull request has $COMMITS commits. PRs land as exactly one commit (merged with a merge commit): squash them, then push with --force-with-lease."
            exit 1
          fi

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Changed published packages have a changeset
        env:
          BASE: ${{ github.base_ref }}
        run: |
          pnpm changeset status --since="origin/$BASE" || {
            echo "::error::This PR changes a published package without a changeset. Run 'pnpm changeset' (or 'pnpm changeset --empty' when no release is needed) and amend your commit."
            exit 1
          }
