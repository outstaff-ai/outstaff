name: CI

on:
  pull_request:
    # edited: a PR whose base changes (e.g. a stacked PR retargeted) is checked again
    types: [opened, synchronize, reopened, edited]
  # the merge queue tests each PR combined with everything ahead of it
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTSTAFF_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm check:tests
      - run: pnpm check:files
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm coverage:summary
        if: always()
      - run: pnpm build

  conventional:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then echo "Checked on the pull request."; exit 0; fi
          pattern='^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be a conventional commit, e.g. 'feat(core): add the loader'. It becomes the squash commit's subject. Got: $TITLE"
            exit 1
          fi
