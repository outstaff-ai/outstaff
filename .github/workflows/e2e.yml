name: End-to-end

# The acme loop on Docker Compose with the real office and agent images and stand-ins for GitHub, the tracker and
# the model (e2e/). It takes 10 to 12 minutes in CI and needs no secrets. It runs every night, by hand, and as a gate of
# the Release workflow, not on pull requests: a failure is fixed as a follow-up before the release.
# How it works: CONTRIBUTING.md, "End-to-end test".

on:
  schedule:
    - cron: "23 3 * * *"
  # on a branch: gh workflow run e2e.yml --ref <branch>
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      # The test runs the real `ost hire` from the built CLI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter outstaff... run build
      - uses: docker/setup-buildx-action@v4.4.1
      # The tags are the defaults of e2e/compose.e2e.yaml, so the run starts exactly these images.
      - name: Build office
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: office
          load: true
          tags: outstaff/office:local
          cache-from: type=gha,scope=office
          cache-to: type=gha,mode=max,scope=office
      - name: Build agent with the scripted runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: agent-e2e
          load: true
          tags: outstaff/agent-e2e:local
          # Its own scope: sharing `agent` with the Images workflow made each overwrite the other's cache (#417).
          cache-from: |
            type=gha,scope=agent-e2e
            type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent-e2e
      - name: Build the GitHub and tracker stand-ins
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: images/Dockerfile
          target: e2e-stubs
          load: true
          tags: outstaff/e2e-stubs:local
          cache-from: type=gha,scope=e2e-stubs
          cache-to: type=gha,mode=max,scope=e2e-stubs
      - name: The acme loop
        run: node e2e/run.ts
        env:
          E2E_PREBUILT: "1"
          E2E_TIMEOUT_MS: "1200000"
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
      # Each service's full log, and on a failure its details and the stub's state: the job log keeps only tails.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 7
          if-no-files-found: warn
