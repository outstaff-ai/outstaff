version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # @types/node follows the pinned Node.js major (devEngines.runtime); bump both together by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The avatar styles (@dicebear/collection) must match @dicebear/core's major: bump them together.
      dicebear:
        patterns:
          - "@dicebear/*"
