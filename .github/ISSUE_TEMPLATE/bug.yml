name: Bug report
description: Something does not work the way the docs or the code say it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not report security issues here: follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Run `pnpm ...`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which part of Outstaff is affected?
      options:
        - core
        - catalog
        - cli
        - agent
        - office
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The released version, or the commit SHA you tested.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, pnpm version, operating system, and how you run the containers (if relevant).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove secrets, tokens and internal hostnames first.
      render: shell
